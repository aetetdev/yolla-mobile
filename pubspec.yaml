name: yolla
description: "Yolla - swipe kartlarıyla turistik yer keşfi ve gezi rotası"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Çeviri ve biçimlendirme
  intl: any

  # Durum yönetimi
  flutter_riverpod: ^3.4.2

  # Yönlendirme
  go_router: ^17.5.0

  # Ağ
  dio: ^5.11.0

  # Model üretimi
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Depolama
  flutter_secure_storage: 10.3.1

  # Yardımcılar
  uuid: ^4.6.0
  cached_network_image: ^3.4.1
  collection: ^1.19.1

  # Yol tarifi, Wikipedia ve website bağlantılarını açmak için
  url_launcher: ^6.3.2
  # 0.22.0'a JDK 17 yüzünden sabitlenmişti. JDK 21 kurulunca (2026-08-14)
  # yükseltildi: 0.26.2 Android tarafında haritayı `textureMode(false)` ile
  # kuruyor (0.22 her zaman `true` kullanıyordu) ve platform görünümü
  # kompozisyonu bu sürümde elden geçmiş.
  maplibre_gl: 0.26.2
  geolocator: ^14.0.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Harita stili. Karo adresi çalışma anında {TILE_BASE} yerine konuyor;
    # emülatör 10.0.2.2, gerçek cihaz adb reverse ile localhost kullanıyor.
    - assets/map/

# Uygulama ikonu üretimi:  dart run flutter_launcher_icons
#
# Adaptive ikonun ön planı ayrı bir dosya: zemini şeffaflaştırılmış ve
# Y işareti güvenli alana sığacak şekilde küçültülmüş hali. Tam kare görsel
# ön plan olarak verilseydi maske Y'nin kollarını kırpardı.
flutter_launcher_icons:
  image_path: assets/brand/icon-y.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0F585E"
  adaptive_icon_foreground: assets/brand/icon-y-foreground.png
